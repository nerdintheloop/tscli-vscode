scopeName: inline.tscli

injectionSelector: "L:source.ts"

patterns:
  - begin: \btscli\`
    end: \`
    patterns:
      - comment: Comment
        match: ^\s*(#.*)$
        captures:
          1: { name: comment.line.tscli }

      - comment: Category
        match: ^\s*([^#\n]+?):\s*(?=#|$)
        captures:
          1: { name: entity.name.type.tscli }

      - comment: Command
        match: ^\s*([A-Za-z0-9][A-Za-z0-9_-]*)(\*)?(?:\s+([^#]*?))?\s*(?=#|$)
        captures:
          1: { name: entity.name.function.tscli }
          2: { name: keyword.operator.alias.tscli }
          3: { name: string.unquoted.tscli }

      - comment: Command Flag Argument
        match: ^\s*--([a-z][a-z0-9]*(?:-[a-z0-9]+)*)(?:\s+-([a-zA-Z0-9])?)?(?:\s+(number|string))?(?:\s+([^#]*?))?\s*(?=#|$)
        captures:
          1: { name: variable.parameter.tscli }
          2: { name: variable.parameter.tscli }
          3: { name: storage.type.tscli }
          4: { name: string.unquoted.tscli }

      - comment: Command Positional Argument
        match: ^\s*\.\s*([a-z][a-z0-9]*(?:-[a-z0-9]+)*)(?:\s+(number))?(?:\s+([^#]*?))?\s*(?=#|$)
        captures:
          1: { name: variable.parameter.tscli }
          2: { name: storage.type.tscli }
          3: { name: string.unquoted.tscli }

      - comment: Command Rest Argument
        match: ^\s*\.{3}([a-z][a-z0-9]*(?:-[a-z0-9]+)*)(?:\s+(string))?(?:\s+([^#]*?))?\s*(?=#|$)
        captures:
          1: { name: variable.parameter.tscli }
          2: { name: storage.type.tscli }
          3: { name: string.unquoted.tscli }
